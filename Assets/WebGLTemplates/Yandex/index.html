<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <link rel="stylesheet" href="TemplateData/style.css">
  <!-- Yandex serves /sdk.js on the game origin. Locally it 404s and the mock takes over (see cars-platform.js). -->
  <script src="/sdk.js" onerror="window.__ysdkMissing = true;"></script>
  <script src="TemplateData/cars-platform.js"></script>
</head>
<body>
  <div id="cars-root">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="cars-loading"><div id="cars-loading-bar"><div id="cars-loading-fill"></div></div></div>
  </div>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    (function () {
      // Recovery lives in the page so it also works when the adapter script fails to load.
      function showRetry(reason) {
        console.error('[cars] boot failed', reason);
        var el = document.getElementById('cars-retry');
        if (!el) {
          var messages = {
            en: ['The game could not load. Check your connection and try again.', 'Try again'],
            ru: ['Не удалось загрузить игру. Проверьте соединение и попробуйте ещё раз.', 'Повторить'],
            uk: ['Не вдалося завантажити гру. Перевірте з’єднання та спробуйте ще раз.', 'Спробувати ще раз'],
            de: ['Das Spiel konnte nicht geladen werden. Prüfe deine Verbindung und versuche es erneut.', 'Erneut versuchen'],
            es: ['No se pudo cargar el juego. Comprueba tu conexión e inténtalo de nuevo.', 'Reintentar'],
            fr: ['Impossible de charger le jeu. Vérifiez votre connexion et réessayez.', 'Réessayer'],
            pt: ['Não foi possível carregar o jogo. Verifique a conexão e tente novamente.', 'Tentar novamente'],
            tr: ['Oyun yüklenemedi. Bağlantını kontrol edip tekrar dene.', 'Tekrar dene'],
            zh: ['游戏加载失败。请检查网络连接后重试。', '重试']
          };
          var language = window.CarsPlatform ? window.CarsPlatform.env().lang : '';
          var code = (language || navigator.language || 'en').toLowerCase().slice(0, 2);
          if (!messages[code]) code = 'en';
          el = document.createElement('div'); el.id = 'cars-retry';
          el.lang = code;
          var content = document.createElement('div');
          var message = document.createElement('div'); message.textContent = messages[code][0]; message.setAttribute('role', 'alert');
          var button = document.createElement('button'); button.id = 'cars-retry-btn'; button.type = 'button'; button.textContent = messages[code][1];
          button.onclick = function () { location.reload(); };
          content.appendChild(message); content.appendChild(button); el.appendChild(content);
          (document.getElementById('cars-root') || document.body).appendChild(el);
        }
        var loading = document.getElementById('cars-loading');
        if (loading) loading.style.display = 'none';
        el.style.display = 'flex';
        document.getElementById('cars-retry-btn').focus();
      }
      var canvas = document.querySelector('#unity-canvas');
      var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
      var config = {
        arguments: [],
        dataUrl: 'Build/{{{ DATA_FILENAME }}}',
        frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_THREADS
        workerUrl: 'Build/{{{ WORKER_FILENAME }}}',
#endif
#if USE_WASM
        codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if MEMORY_FILENAME
        memoryUrl: 'Build/{{{ MEMORY_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
        streamingAssetsUrl: 'StreamingAssets',
        autoSyncPersistentDataPath: true,   // PlayerPrefs/IDBFS sync without the deprecated manual JS_FileSystem_Sync
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        // Keep diagnostics in the console. Some fatal loader errors only call this
        // callback without rejecting the startup promise, so offer a localized retry.
        showBanner: function (msg, type) {
          console.warn('[unity]', type, msg);
          if (type === 'error' && !window.unityInstance) showRetry(msg);
        },
        // Biggest mobile perf lever: do not render at native DPR on phones.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, isMobile ? 1.0 : 1.5)
      };
      document.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      var fill = document.querySelector('#cars-loading-fill');
      // Init the host SDK (or mock) first so game_api_pause is buffered before Unity boots.
      Promise.resolve().then(function () {
        if (!window.CarsPlatform) throw new Error('platform adapter missing');
        return window.CarsPlatform.boot();
      }).then(function () {
        return createUnityInstance(canvas, config, function (p) { fill.style.width = (100 * p) + '%'; });
      }).then(function (instance) {
        document.querySelector('#cars-loading').style.display = 'none';
        window.unityInstance = instance;                 // QA/debug tooling reads Module.HEAPU8 through this
        window.CarsPlatform.attach(instance);
      }).catch(showRetry);
    })();
  </script>
</body>
</html>
